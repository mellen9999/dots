# hand-written policy — replaces cachyos-ananicy-rules (removed aug26 2026).
# that package shipped 392 files of unreviewed scheduling policy that silently
# outranked games: bash -> Doc-View -> nice -4 (every background script), and
# chromium -> Doc-View (browser beating the game for cpu+io).
# scx_lavd does latency-aware placement; gamemode boosts games. we only need
# the handful of explicit deprioritisations below.
check_freq = 15
cgroup_load = false
type_load = false
rule_load = true
apply_nice = true
apply_latnice = true
apply_ionice = true
apply_sched = false
apply_oom_score_adj = false
apply_cgroup = false
loglevel = info
log_applied_rule = false
cgroup_realtime_workaround = false
