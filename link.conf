# source (relative to sync/config) : target (absolute, ~ expanded) : hostname (optional)

# shell
.bashrc:~/.bashrc
.tmux.conf:~/.tmux.conf
.inputrc:~/.inputrc
.gitconfig:~/.gitconfig

# app configs (all machines)
config/foot:~/.config/foot
config/mpv:~/.config/mpv
config/btop:~/.config/btop
config/mako:~/.config/mako
config/atuin:~/.config/atuin

# scripts
bin:~/.local/bin/sync-bin

# systemd user services (all machines)
systemd-user/sync-to-nas.service:~/.config/systemd/user/sync-to-nas.service
systemd-user/sync-to-nas.timer:~/.config/systemd/user/sync-to-nas.timer
systemd-user/spotify-dl.service:~/.config/systemd/user/spotify-dl.service

# heatsync backup pull (heatpc-only — single puller is enough)

# warden deadman watchdog (heatpc-only — warden itself also moved here 2026-09-24 while
# mele is off; this now watches warden locally + the NAS backup)
scripts/warden-watchdog.sh:~/scripts/warden-watchdog.sh:heatpc
systemd-user/warden-watchdog.service:~/.config/systemd/user/warden-watchdog.service:heatpc
systemd-user/warden-watchdog.timer:~/.config/systemd/user/warden-watchdog.timer:heatpc

# router backup pull (heatpc-only — moved off mele 2026-09-14: mele died and took the
# backup with it, newest tarball was a week stale. syncthing distributes the pulled file.)

# atuin sync server (heatpc-only — moved off mele 2026-09-24 while mele is powered off)
systemd-user/atuin-server.service:~/.config/systemd/user/atuin-server.service:heatpc

# pipewire
config/pipewire/pipewire.conf.d/mele-mic.conf:~/.config/pipewire/pipewire.conf.d/mele-mic.conf
# heatpc rig: live mono mic source (rack does dynamics) + gaming audio quirks
config/pipewire/pipewire.conf.d/cosmos-mono.conf:~/.config/pipewire/pipewire.conf.d/cosmos-mono.conf:heatpc
config/pipewire/pipewire.conf.d/10-gaming.conf:~/.config/pipewire/pipewire.conf.d/10-gaming.conf:heatpc

# project CLAUDE.md (symlinked into repos)
heatsync-CLAUDE.md:~/projects/heatsync/CLAUDE.md
bazaarinfo-CLAUDE.md:~/projects/bazaarinfo/CLAUDE.md
cmdchamp-CLAUDE.md:~/projects/cmdchamp/CLAUDE.md

# claude skills (synced to both machines)
claude-skills/cpd:~/.claude/skills/cpd
claude-skills/check:~/.claude/skills/check
claude-skills/audit:~/.claude/skills/audit
claude-skills/ssh:~/.claude/skills/ssh
claude-skills/git-quick:~/.claude/skills/git-quick
claude-skills/prod-health:~/.claude/skills/prod-health
claude-skills/dev:~/.claude/skills/dev
claude-skills/test:~/.claude/skills/test
claude-skills/sync-config:~/.claude/skills/sync-config

# 3d printing (MeLE only — printer on local network)
config/orca-slicer-cli:~/.config/orca-slicer-cli:MeLE

# heatpc-only (gaming)
config/gamemode.ini:~/.config/gamemode.ini:heatpc
config/MangoHud:~/.config/MangoHud:heatpc

# lifeplanner desktop notifications (heatpc desktop — topic file recreated manually, not synced)
# ntfy-desktop = the notifier + sole appointment-alarm transport (one beep, since= catch-up).
systemd-user/ntfy-desktop.service:~/.config/systemd/user/ntfy-desktop.service:heatpc

# lifeplanner off-machine backup pull (heatpc pulls mele over tailscale)

# claude setup selfcheck (all machines)
systemd-user/claude-selfcheck.service:~/.config/systemd/user/claude-selfcheck.service
systemd-user/claude-selfcheck.timer:~/.config/systemd/user/claude-selfcheck.timer

# chromium launch flags (heatpc — wayland + extensions; vaapi deliberately off, see ow-crash notes)
config/chromium-flags.conf:~/.config/chromium-flags.conf:heatpc

# disk health (all machines) — needs /etc/sudoers.d/zz-disk-health
systemd-user/disk-health.service:~/.config/systemd/user/disk-health.service
systemd-user/disk-health.timer:~/.config/systemd/user/disk-health.timer

# router backup (mele)
scripts/router-backup:~/scripts/router-backup:heatpc
systemd-user/router-backup.service:~/.config/systemd/user/router-backup.service:heatpc
systemd-user/router-backup.timer:~/.config/systemd/user/router-backup.timer:heatpc

# encrypted home backup (all machines) — targets/excludes/password live in ~/.config/restic, per box
systemd-user/backup-restic.service:~/.config/systemd/user/backup-restic.service
systemd-user/backup-restic.timer:~/.config/systemd/user/backup-restic.timer
# OnFailure= target for unattended units — pushes to ntfy so a broken timer
# is not just a journal line nobody reads
systemd-user/alert@.service:~/.config/systemd/user/alert@.service

# heatsync canary/pulse scripts (heatpc-only — moved off mele 2026-09-24 while mele is powered off)
scripts/hs-surfaces.ts:~/scripts/hs-surfaces.ts:heatpc
scripts/hs-pulse.ts:~/scripts/hs-pulse.ts:heatpc

# media keybinds (dwl) — shadows v4l-utils media-ctl, needs ~/.local/bin before /usr/bin
media-ctl:~/.local/bin/media-ctl
