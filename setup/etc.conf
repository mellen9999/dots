# src (relative to sync/config) : dest : hostname or package group (optional) : mode (default 644)
# COPIED root-owned, never symlinked: a user-writable file under /etc is a root shell.
# a tagged line overrides an untagged one with the same dest.

# kernel + system
etc/sysctl/90-hardening.conf:/etc/sysctl.d/90-hardening.conf
etc/sysctl/90-tuning.conf:/etc/sysctl.d/90-tuning.conf
etc/thp.conf:/etc/tmpfiles.d/thp.conf
etc/zram-generator.conf:/etc/systemd/zram-generator.conf
etc/journald-size.conf:/etc/systemd/journald.conf.d/size.conf
etc/coredump-size.conf:/etc/systemd/coredump.conf.d/size.conf
etc/makepkg-parallel.conf:/etc/makepkg.conf.d/parallel.conf
ananicy/ananicy.conf:/etc/ananicy.d/ananicy.conf
ananicy/99-heatpc.rules:/etc/ananicy.d/99-heatpc.rules

# security
etc/nftables/base.conf:/etc/nftables.conf
etc/sshd-hardening.conf:/etc/ssh/sshd_config.d/10-hardening.conf
etc/fail2ban-jail.local:/etc/fail2ban/jail.local:personal
etc/faillock.conf:/etc/security/faillock.conf
etc/sudoers-disk-health:/etc/sudoers.d/zz-disk-health:personal:440
etc/chromium-policy-privacy.json:/etc/chromium/policies/managed/privacy.json:personal
etc/local-bin/security-update-check:/usr/local/bin/security-update-check::755
etc/units/security-update-check.service:/etc/systemd/system/security-update-check.service
etc/units/security-update-check.timer:/etc/systemd/system/security-update-check.timer

# claude scratchpads live in ram-backed /tmp
etc/local-bin/tmp-reap:/usr/local/bin/tmp-reap::755
etc/units/tmp-reap.service:/etc/systemd/system/tmp-reap.service
etc/units/tmp-reap.timer:/etc/systemd/system/tmp-reap.timer

# audio realtime
etc/audio-nice.conf:/etc/security/limits.d/30-audio-nice.conf
etc/pipewire-rt.conf:/etc/systemd/user/pipewire.service.d/rt.conf
etc/pipewire-rt.conf:/etc/systemd/user/pipewire-pulse.service.d/rt.conf
etc/pipewire-rt.conf:/etc/systemd/user/wireplumber.service.d/rt.conf

