# one row along the top-left, ends before the centered cam pip:
# [hud bar] [CAM] — cam is gsr's pip at top-center (40%..60% of width)
horizontal
position=top-left
offset_x=16
offset_y=0
font_size=20
background_alpha=0.3
round_corners=0

fps
fps_color_change
fps_value=250,450

cpu_stats
cpu_load_change

gpu_stats
gpu_load_change
gpu_temp
pci_dev=0:03:00.0

cpu_temp
vram
frame_timing=0

# fps telemetry
output_folder=$HOME/.local/share/mangohud-logs
log_duration=120
log_interval=0
toggle_logging=Shift_L+F2
