--ozone-platform=wayland
--enable-features=VaapiVideoDecodeLinuxGL
--load-extension=$HOME/sync/config/config/chromium-heatsync-theme,$HOME/.local/share/chromium-extensions/ublock-origin,$HOME/projects/vtabs
--extension-mime-request-handling=always-prompt-for-install
