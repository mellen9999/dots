[main]
font=Terminus:size=14
pad=4x4
dpi-aware=no
bold-text-in-bright=no

[scrollback]
lines=5000

[cursor]
style=block
blink=no

[url]
launch=xdg-open ${url}
osc8-underline=url-mode

[mouse]
hide-when-typing=yes

[bell]
urgent=no
notify=no
visual=no


[colors-dark]
background=000000
foreground=ffffff
cursor=000000 ffffff
selection-foreground=000000
selection-background=c0c0c0

# heatsync palette — vivid, full-contrast, matches the heatsync product (one palette across
# terminal + product). referenced by ANSI name everywhere. brand orange ff8700, gray 808080.
regular0=000000
regular1=cd0000
regular2=00cd00
regular3=ff8700
regular4=5f87ff
regular5=cd00cd
regular6=00cdcd
regular7=c0c0c0

bright0=808080
bright1=ff0000
bright2=00ff00
bright3=ffff00
bright4=5f87ff
bright5=ff00ff
bright6=00ffff
bright7=ffffff
