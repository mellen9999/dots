[main]
font=Terminus:size=14
pad=4x4
dpi-aware=no
bold-text-in-bright=no

[scrollback]
lines=5000

[cursor]
style=block
blink=no

[url]
launch=xdg-open ${url}
osc8-underline=url-mode

[mouse]
hide-when-typing=yes

[bell]
urgent=no
notify=no
visual=no


[colors-dark]
background=000000
foreground=ffffff
cursor=000000 ffffff
selection-foreground=000000
selection-background=ffffff

# 8-color palette — one palette across terminal + desktop + heatsync, referenced by ANSI name.
# no brights: bright slots mirror regular so nothing renders outside the 8. bright0 = #808080 (dim gray, legible on black AND white highlight) so
# "dim" text never goes black-on-black. emphasis = bold/underline/reverse/blink, not color.
regular0=000000
regular1=ff0000
regular2=00ff00
regular3=ffff00
regular4=8888ff
regular5=ff00ff
regular6=00ffff
regular7=ffffff

bright0=808080
bright1=ff0000
bright2=00ff00
bright3=ffff00
bright4=8888ff
bright5=ff00ff
bright6=00ffff
bright7=ffffff
