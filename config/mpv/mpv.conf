# Video output - Vulkan + gpu-next for RDNA 4
vo=gpu-next
gpu-api=vulkan
hwdec=auto-safe

# Low latency streaming
[protocol.https]
profile=low-latency

[protocol.http]
profile=low-latency

[low-latency]
profile-desc=Low latency live streaming
untimed=yes
cache=no
cache-pause=no
demuxer-lavf-o-set=fflags=nobuffer
demuxer-lavf-analyzeduration=0
demuxer-lavf-probesize=32768
interpolation=no
video-latency-hacks=yes
stream-buffer-size=4k

# General
volume=40
keep-open=yes
save-position-on-quit=yes
cursor-autohide=1000
ytdl-format=bestvideo[height<=1080]+bestaudio/best[height<=1080]

# Scaling - fast but clean for 1080p native
scale=bilinear
dscale=bilinear
cscale=bilinear

# OSD
osd-font-size=32
osd-duration=2000

# Screenshots
screenshot-format=png
screenshot-png-compression=3
