# Video output - Vulkan + gpu-next for RDNA 4
vo=gpu-next
gpu-api=vulkan
hwdec=auto-safe

# Low latency, live channel pages only (twitch.tv/x, kick.com/x, …/live); vods and clips play normally
[low-latency]
profile-desc=Low latency live streaming
profile-cond=(function(p) return p:match("^https://www%.twitch%.tv/[%w_]+$") or p:match("^https://kick%.com/[%w_-]+$") or p:match("/live$") end)(get("path", ""))
profile-restore=copy
cache=no
cache-pause=no
demuxer-lavf-o-set=fflags=nobuffer
demuxer-lavf-analyzeduration=0
demuxer-lavf-probesize=32768
interpolation=no
video-latency-hacks=yes

# General
volume=40
keep-open=yes
save-position-on-quit=yes
cursor-autohide=1000
ytdl-format=bestvideo[height<=1080]+bestaudio/best[height<=1080]

# Scaling - fast but clean for 1080p native
scale=bilinear
dscale=bilinear
cscale=bilinear

# OSD
osd-font-size=32
osd-duration=2000

# Screenshots
screenshot-format=png
screenshot-png-compression=3
