#!/usr/bin/nft -f
# default-drop inbound. ssh + tailnet only; lan services (syncthing, mosh) ride tailscale0
destroy table inet filter
table inet filter {
  chain input {
    type filter hook input priority filter
    policy drop
    iif lo accept comment "loopback before invalid: self-connected sockets (wine/wow voice) read as invalid"
    ct state invalid drop comment "early drop of invalid connections"
    ct state {established, related} accept comment "allow tracked connections"
    meta l4proto { icmp, icmpv6 } accept comment "allow icmp"
    tcp dport ssh accept comment "allow sshd"
    iifname "tailscale0" accept comment "tailnet — wireguard-authenticated + tailnet acl"
    udp dport 41641 accept comment "tailscale direct path, avoids derp relay"
    pkttype host limit rate 5/second counter reject with icmpx type admin-prohibited
    counter
  }
  chain forward {
    type filter hook forward priority filter
    policy drop
    iifname "docker0" accept comment "docker egress"
    iifname "br-*" accept comment "docker compose egress"
    oifname "docker0" ct state {established, related} accept comment "docker return traffic"
    oifname "br-*" ct state {established, related} accept comment "docker compose return traffic"
  }
}
