# terminal — defaults to tmux-256color, .tmux.local.conf overrides for TTY
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
# tell tmux what the OUTER terminal (foot) can do — esp. synchronized output (sync),
# without which Claude Code's full-screen redraws tear and land text in the wrong spot
set -as terminal-features ",foot*:RGB:sync:hyperlinks:overline:usstyle:strikethrough:title"
# osc52 for every outer terminal, not just the ones tmux happens to recognise —
# this is what carries `copy` out to the phone when it's attached over plain ssh
set -as terminal-features ",*:clipboard"

# vi everywhere
setw -g mode-keys vi
set -g status-keys vi

# keybinds: stock tmux — learning defaults (prefix C-b, % " splits, o/arrows nav, [ copy)

# no mouse
set -g mouse off

# colors — og mono: black bar, white text, stock flags (* - #) carry all state
# prev scheme (yellow/red) — swap back:
#   pane-active-border "fg=brightyellow" | pane-border "fg=black"
#   window-current "bg=black,fg=brightwhite,bold" + format " #I:#W#{?window_flags,#{window_flags}, } "
#   window-activity "fg=brightred,bold" | window-status "fg=black,bold"
#   message "fg=black,bg=brightyellow,bold" | status "bg=brightyellow,fg=black"
#   status-left "#[fg=black,bold] [#S]   " | status-right metrics fg=black, clock "#[fg=brightred,bold]"
set -g pane-active-border-style "fg=#ffffff"
set -g pane-border-style "fg=#7f7f7f"
setw -g window-status-activity-style default
# claude session state: hq-status sets each window's own window-status-style —
# green=working, yellow=your move (bold when blocked on a prompt). It cannot be
# done from the format: #{@hqstate} expands empty during status rendering.
set -g window-status-format "#I:#W#{?window_flags,#{window_flags}, }"
set -g window-status-current-format "#I:#W#{?window_flags,#{window_flags}, }"
set -g message-style reverse
set -g status-style "bg=#000000,fg=#ffffff"

set -g status-left "[#S]   "
set -g status-left-length 20
set -g status-right "#($HOME/.local/bin/hq bar)"
set -g status-right-length 12
set -g status-interval 5

# quality of life
set -g renumber-windows on
set -g set-titles on
set -g set-titles-string "#S:#I.#P #W — #T"
setw -g aggressive-resize on
set -g display-panes-time 2000
setw -g monitor-activity on
set -g visual-activity on
set -g focus-events on
set -g set-clipboard on
set -g detach-on-destroy off

# auto-rename windows: shell/claude panes show cwd, everything else shows the command
setw -g automatic-rename on
setw -g automatic-rename-format "#{?pane_in_mode,[copy],#{?#{||:#{==:#{pane_current_command},bash},#{m:*claude*,#{pane_current_command}}},#{?#{==:#{pane_current_path},#{HOME}},~,#{b:pane_current_path}},#{pane_current_command}}}"

# reduce escape delay (important for vi)
set -sg escape-time 0

# sixel passthrough (for printwatch camera)
set -g allow-passthrough on

# history
set -g history-limit 10000

# start window/pane numbering at 1
set -g base-index 1
setw -g pane-base-index 1

# per-machine/terminal overrides (generated by .bashrc)
if-shell '[ -f ~/.tmux.local.conf ]' 'source-file ~/.tmux.local.conf'

